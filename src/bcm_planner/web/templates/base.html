<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BCM Continuity Planner — Workshop Tool{% endblock %}</title>
<style>
    :root { --brand: #0b3d5c; --brand-light: #eaf1f7; }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        margin: 0; background: #f4f6f8; color: #1a1a1a;
    }
    header {
        background: var(--brand); color: #fff; padding: 14px 24px;
        display: flex; justify-content: space-between; align-items: center;
    }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a { color: #dce8f2; margin-left: 16px; text-decoration: none; font-size: 14px; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 960px; margin: 24px auto; padding: 0 20px 60px; }
    .card {
        background: #fff; border: 1px solid #dde3e8; border-radius: 8px;
        padding: 20px 24px; margin-bottom: 20px;
    }
    h1 { color: var(--brand); font-size: 22px; }
    h2 { color: var(--brand); font-size: 17px; border-bottom: 1px solid #e0e6ea; padding-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
    th, td { border: 1px solid #e0e6ea; padding: 6px 9px; text-align: left; }
    th { background: var(--brand-light); color: var(--brand); }
    form.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 10px 0; }
    label { display: block; font-size: 12.5px; color: #555; margin-bottom: 3px; }
    input, select, textarea {
        padding: 6px 8px; border: 1px solid #c7cfd6; border-radius: 4px; font-size: 14px;
        min-width: 160px;
    }
    textarea { min-width: 300px; }
    button, .btn {
        background: var(--brand); color: #fff; border: none; padding: 8px 16px;
        border-radius: 5px; font-size: 14px; cursor: pointer; text-decoration: none;
        display: inline-block;
    }
    button:hover, .btn:hover { background: #082e46; }
    .btn-secondary { background: #6c8299; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11.5px; color: #fff; }
    .badge-open { background: #c0392b; }
    .badge-closed { background: #27ae60; }
    .badge-selected { background: #2980b9; }
    .flash { padding: 10px 14px; background: #eafaf1; border: 1px solid #27ae60; border-radius: 5px; margin-bottom: 16px; }
    .flash-error { background: #fdecea; border-color: #c0392b; }
    .muted { color: #777; font-size: 13.5px; }
    .token-box { background: #f0f4f8; border: 1px dashed var(--brand); border-radius: 6px; padding: 12px 16px; font-family: monospace; word-break: break-all; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
</style>
</head>
<body>
<header>
    <a href="/">BCM Continuity Planner — Workshop Tool</a>
    {% if session_token %}
    <nav>
        <a href="/session/{{ session_token }}/">Dashboard</a>
        <a href="/session/{{ session_token }}/bia">BIA</a>
        <a href="/session/{{ session_token }}/bcp">BCP</a>
        <a href="/session/{{ session_token }}/cmt">CMT</a>
    </nav>
    {% endif %}
</header>
<main>
{% if request.query_params.get('flash') %}
<div class="flash">{{ request.query_params.get('flash') }}</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
